<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./entrar.css">

    <title>Entrar — STARLIT</title>
</head>

<body>

    <!-- ESTRELAS -->
    <div class="stars"></div>


    <!-- CONTAINER PRINCIPAL -->
    <main class="login-page">

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <img src="./assets/img/LOGO STARLIT.jpg" alt="STARLIT">
        </a>


        <!-- CARD DE LOGIN -->
        <section class="login-card">

            <div class="login-header">

                <p class="eyebrow">
                    BEM-VINDO DE VOLTA
                </p>

                <h1>
                    Entre no seu
                    <span>universo.</span>
                </h1>

                <p class="description">
                    Entre na sua conta para continuar
                    sua jornada pelo STARLIT.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form class="login-form">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" name="email" placeholder="seuemail@gmail.com" required>

                </div>


                <!-- SENHA -->
                <div class="input-group">

                    <div class="password-label">

                        <label for="senha">
                            Senha
                        </label>

                        <a href="#">
                            Esqueci minha senha
                        </a>

                    </div>

                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                </div>


                <!-- BOTÃO -->
                <button type="submit" class="login-button">
                    Entrar
                    <span>→</span>
                </button>

            </form>


            <!-- CADASTRO -->
            <div class="register">

                <span>
                    Ainda não faz parte do STARLIT?
                </span>

                <a href="#cadastro">
                    Criar minha conta
                </a>

            </div>

        </section>


        <!-- VOLTAR -->
        <a href="index.html" class="back">
            ← Voltar para o início
        </a>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>
            © 2026 STARLIT. Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
