<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./cadatrar.css">
    <link rel="icon" type="image/png" href="./assets/img/MASCOTE DAY DREAM.png">

    <title>Cadastrar — STARLIT</title>
</head>

<body>

    <!-- ESTRELAS -->
    <div class="stars"></div>


    <!-- CONTAINER PRINCIPAL -->
    <main class="register-page">

        <!-- LOGO -->
        <a href="index.html" class="logo">
            <img
                src="./assets/img/LOGO STARLIT.jpg"
                alt="STARLIT"
            >
        </a>


        <!-- CARD DE CADASTRO -->
        <section class="register-card">

            <div class="register-header">

                <p class="eyebrow">
                    BEM-VINDO AO STARLIT
                </p>

                <h1>
                    Crie seu
                    <span>universo.</span>
                </h1>

                <p class="description">
                    Crie sua conta e comece sua jornada
                    pelo universo do STARLIT.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form class="register-form">

                <!-- NOME -->
                <div class="input-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Como podemos te chamar?"
                        required
                    >

                </div>


                <!-- E-MAIL -->
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@gmail.com"
                        required
                    >

                </div>


                <!-- SENHA -->
                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-input">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            required
                        >
                        <button type="button" class="toggle-password" aria-label="Mostrar senha">&#128065;</button>
                    </div>

                </div>


                <!-- CONFIRMAR SENHA -->
                <div class="input-group">

                    <label for="confirmar-senha">
                        Confirmar senha
                    </label>

                    <div class="password-input">
                        <input
                            type="password"
                            id="confirmar-senha"
                            name="confirmar-senha"
                            placeholder="Digite sua senha novamente"
                            required
                        >
                        <button type="button" class="toggle-password" aria-label="Mostrar senha">&#128065;</button>
                    </div>

                </div>


                <!-- TERMOS -->
                <label class="terms">

                    <input
                        type="checkbox"
                        name="termos"
                        required
                    >

                    <span>
                        Li e concordo com os termos de uso
                        e a política de privacidade.
                    </span>

                </label>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="register-button"
                >
                    Criar minha conta
                    <span>→</span>
                </button>

            </form>


            <!-- LOGIN -->
            <div class="login-link">

                <span>
                    Já faz parte do STARLIT?
                </span>

                <a href="entrar.html">
                    Entrar na minha conta
                </a>

            </div>

        </section>


        <!-- VOLTAR -->
        <a href="index.html" class="back">
            ← Voltar para o início
        </a>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <p>
            © 2026 STARLIT. Todos os direitos reservados.
        </p>

    </footer>

    <script src="./assets/js/auth.js"></script>

</body>

</html>
